<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudo</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo" aria-hidden="true"></canvas>
    <script src="nudo-geometria.js"></script>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const G = window.NudoGeo;

      const LIMA = '#c6f25e';
      const LIMA_CLARO = '#f0ffcc';
      const LIMA_FONDO = 'rgba(198, 242, 94, 0.12)';
      const TINTA = '#12160a';
      const TINTA_BORDE = 'rgba(18, 22, 10, 0.5)';
      const lima = (a) => `rgba(198, 242, 94, ${a})`;
      const miel = (a) => `rgba(242, 179, 61, ${a})`;

      const MARGEN_CURVA = 12;
      const AJUSTE_MS = 320; // el objetivo se movió: la abejita se reacomoda
      const DESTELLO_MS = 420;
      const RASTRO_MS = 380;
      const ANILLO_MS = 260;
      const LATIDO_MS = 1800;
      const MARCA_MS = 200;
      const ASENTAR_MS = 500; // el vaivén crece de a poco al posarse
      const RITMO_REPOSO = 1000 / 30; // en reposo alcanza con ~30 cuadros por segundo
      const SALIDA_MS = 200; // al limpiar: el marco se encoge y la abejita se va hacia el reloj (Rust oculta a los 240 ms)

      const lienzo = document.getElementById('lienzo');
      const ctx = lienzo.getContext('2d');
      const sinMovimiento = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const monitor = () => ({ ancho: window.innerWidth, alto: window.innerHeight });
      const limitar = (x) => Math.min(Math.max(x, 0), 1);

      let generacion = 0;
      let dibujo = null;
      // { pos, destino, vuelo: {p0,c,p1,inicio,dur} | null, ajuste: {desde,hasta,inicio} | null, llegada }
      let abeja = null;
      let rastro = [];
      let destello = null;
      let anilloDesde = 0;
      let marcaDesde = 0;
      let cuadro = 0;
      let espera = 0;
      let sucio = null;
      // { inicio, antes, desde, origen, ultimo } mientras el dibujo que se limpió hace su salida.
      let salida = null;

      function ajustar() {
        const d = window.devicePixelRatio || 1;
        lienzo.width = Math.round(window.innerWidth * d);
        lienzo.height = Math.round(window.innerHeight * d);
        ctx.setTransform(d, 0, 0, d, 0, 0);
        sucio = null;
      }

      // Solo se borra lo que se pintó en el cuadro anterior: el lienzo cubre toda la pantalla.
      function ensuciar(x, y, ancho, alto) {
        const c = [x - 3, y - 3, x + ancho + 3, y + alto + 3];
        sucio = sucio
          ? [Math.min(sucio[0], c[0]), Math.min(sucio[1], c[1]), Math.max(sucio[2], c[2]), Math.max(sucio[3], c[3])]
          : c;
      }

      function limpiar() {
        if (sucio) ctx.clearRect(sucio[0], sucio[1], sucio[2] - sucio[0], sucio[3] - sucio[1]);
        sucio = null;
      }

      function borrarTodo() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        sucio = null;
      }

      function parar() {
        cancelAnimationFrame(cuadro);
        clearTimeout(espera);
        cuadro = 0;
        espera = 0;
      }

      function programar(rapido) {
        if (rapido && espera) {
          clearTimeout(espera);
          espera = 0;
        }
        if (cuadro || espera) return;
        if (rapido) cuadro = requestAnimationFrame(pintar);
        else
          espera = setTimeout(() => {
            espera = 0;
            cuadro = requestAnimationFrame(pintar);
          }, RITMO_REPOSO);
      }

      // ---- Formas ----

      // Recuadro con esquinas cortadas a 60°, como los lados de un hexágono.
      function caminoPanal(r, inflar) {
        const x = r.x - inflar;
        const y = r.y - inflar;
        const w = r.ancho + inflar * 2;
        const h = r.alto + inflar * 2;
        const cv = Math.min(9, h / 3, w / 3);
        const ch = cv * 0.58;
        ctx.beginPath();
        ctx.moveTo(x + ch, y);
        ctx.lineTo(x + w - ch, y);
        ctx.lineTo(x + w, y + cv);
        ctx.lineTo(x + w, y + h - cv);
        ctx.lineTo(x + w - ch, y + h);
        ctx.lineTo(x + ch, y + h);
        ctx.lineTo(x, y + h - cv);
        ctx.lineTo(x, y + cv);
        ctx.closePath();
        ensuciar(x, y, w, h);
      }

      function hexagono(x, y, radio) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI / 3) * i - Math.PI / 2;
          const px = x + radio * Math.cos(a);
          const py = y + radio * Math.sin(a);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ensuciar(x - radio, y - radio, radio * 2, radio * 2);
      }

      function trazo(ancho, color) {
        ctx.lineWidth = ancho;
        ctx.strokeStyle = color;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      function dibujarMarco(r, alfa, inflar, acento) {
        ctx.save();
        ctx.globalAlpha = alfa;
        caminoPanal(r, 3 + inflar);
        ctx.fillStyle = LIMA_FONDO;
        ctx.fill();
        trazo(4.5, TINTA_BORDE);
        trazo(2, LIMA);
        if (acento) {
          hexagono(r.x - 3 - inflar + 1, r.y - 3 - inflar + 1, 4.5);
          ctx.fillStyle = LIMA;
          ctx.fill();
          trazo(1.5, TINTA_BORDE);
        }
        ctx.restore();
      }

      function dibujarLatido(r, ahora) {
        const p = ((ahora - anilloDesde) % LATIDO_MS) / LATIDO_MS;
        ctx.save();
        ctx.globalAlpha = 0.5 * (1 - p) * (1 - p);
        caminoPanal(r, 3 + 2 + 9 * G.suave(p));
        trazo(2, LIMA);
        ctx.restore();
      }

      function dibujarEtiqueta(r, texto) {
        ctx.save();
        ctx.font = '600 12px system-ui, sans-serif';
        const ancho = Math.min(ctx.measureText(texto).width + 18, 240);
        const x = Math.max(4, Math.min(r.x - 3, window.innerWidth - ancho - 4));
        const y = r.y >= 30 ? r.y - 28 : r.y + r.alto + 8;
        ctx.beginPath();
        ctx.roundRect(x, y, ancho, 20, 10);
        ctx.fillStyle = LIMA;
        ctx.fill();
        trazo(1.5, TINTA_BORDE);
        ctx.fillStyle = TINTA;
        ctx.textBaseline = 'middle';
        ctx.fillText(texto, x + 9, y + 10.5, ancho - 18);
        ensuciar(x, y, ancho, 20);
        ctx.restore();
      }

      function dibujarAbeja(p, aleteo) {
        const [x, y] = p;
        const halo = ctx.createRadialGradient(x, y, 0, x, y, 24);
        halo.addColorStop(0, lima(0.5));
        halo.addColorStop(0.4, lima(0.18));
        halo.addColorStop(1, lima(0));
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(x, y, 24, 0, Math.PI * 2);
        ctx.fill();
        ensuciar(x - 24, y - 24, 48, 48);

        // Alitas: dos elipses translúcidas abiertas hacia los costados que aletean.
        for (const lado of [-1, 1]) {
          ctx.save();
          ctx.translate(x + lado * 2.5, y - 2.5);
          ctx.rotate(lado * 1.05);
          ctx.scale(1, aleteo);
          ctx.beginPath();
          ctx.ellipse(0, -4.6, 3.1, 5.4, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(240, 255, 214, 0.55)';
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(240, 255, 214, 0.8)';
          ctx.stroke();
          ctx.restore();
        }

        // Cuerpo: núcleo claro, borde lima y una franja miel.
        const cuerpo = ctx.createRadialGradient(x - 1.8, y - 1.8, 0.5, x, y, 7);
        cuerpo.addColorStop(0, LIMA_CLARO);
        cuerpo.addColorStop(1, LIMA);
        ctx.beginPath();
        ctx.arc(x, y, 6.5, 0, Math.PI * 2);
        ctx.fillStyle = cuerpo;
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = miel(0.95);
        ctx.fillRect(x - 7, y + 1, 14, 2);
        ctx.restore();
        ctx.beginPath();
        ctx.arc(x, y, 6.5, 0, Math.PI * 2);
        trazo(1.5, TINTA_BORDE);
      }

      function dibujarRastro(ahora) {
        rastro = rastro.filter((q) => ahora - q.t < RASTRO_MS);
        for (let i = 1; i < rastro.length; i++) {
          const a = rastro[i - 1];
          const b = rastro[i];
          const vida = 1 - (ahora - b.t) / RASTRO_MS;
          ctx.beginPath();
          ctx.moveTo(a.p[0], a.p[1]);
          ctx.lineTo(b.p[0], b.p[1]);
          trazo(1 + 3 * vida, miel(0.75 * vida));
          ensuciar(Math.min(a.p[0], b.p[0]) - 4, Math.min(a.p[1], b.p[1]) - 4, Math.abs(a.p[0] - b.p[0]) + 8, Math.abs(a.p[1] - b.p[1]) + 8);
        }
        return rastro.length > 1;
      }

      function dibujarDestello(ahora) {
        if (!destello) return false;
        const k = (ahora - destello.inicio) / DESTELLO_MS;
        if (k >= 1) {
          destello = null;
          return false;
        }
        const [x, y] = destello.p;
        const radio = 6 + 22 * G.suave(limitar(k));
        ctx.beginPath();
        ctx.arc(x, y, radio, 0, Math.PI * 2);
        trazo(2, miel(0.8 * (1 - k)));
        ctx.beginPath();
        ctx.arc(x, y, 7 * (1 - k), 0, Math.PI * 2);
        ctx.fillStyle = lima(0.6 * (1 - k));
        ctx.fill();
        ensuciar(x - 30, y - 30, 60, 60);
        return true;
      }

      function dibujarPulso(centro, ahora) {
        const p = (ahora % 1200) / 1200;
        ctx.beginPath();
        ctx.arc(centro[0], centro[1], 10 + 22 * G.suave(p), 0, Math.PI * 2);
        trazo(2, lima(0.55 * (1 - p)));
        ensuciar(centro[0] - 34, centro[1] - 34, 68, 68);
      }

      // ---- Movimiento de la abejita ----

      // Devuelve true mientras vuela o se reacomoda (necesita todos los cuadros).
      function moverAbeja(ahora, quieto, orbita) {
        const a = abeja;
        if (a.vuelo) {
          const v = a.vuelo;
          const t = limitar((ahora - v.inicio) / v.dur);
          a.pos = G.puntoCurva(v.p0, v.c, v.p1, G.suave(t));
          rastro.push({ p: a.pos, t: ahora });
          if (t >= 1) {
            a.vuelo = null;
            a.llegada = ahora;
          }
          return true;
        }
        if (a.ajuste) {
          const t = limitar((ahora - a.ajuste.inicio) / AJUSTE_MS);
          a.pos = G.interpolar(a.ajuste.desde, a.ajuste.hasta, G.suave(t));
          if (t >= 1) a.ajuste = null;
          return true;
        }
        if (quieto) {
          a.pos = a.destino;
          return false;
        }
        const amp = G.suave(limitar((ahora - a.llegada) / ASENTAR_MS));
        if (orbita) {
          const w = (ahora / 1400) * Math.PI * 2;
          a.pos = [a.destino[0] + Math.sin(w) * 11 * amp, a.destino[1] - (1 - Math.cos(w)) * 6 * amp];
        } else {
          a.pos = [
            a.destino[0] + Math.sin((ahora / 2600) * Math.PI * 2) * 2.2 * amp,
            a.destino[1] + Math.sin((ahora / 1700) * Math.PI * 2 + 1) * 3 * amp,
          ];
        }
        return amp < 1;
      }

      function aleteo(ahora, quieto) {
        if (quieto) return 1;
        const volando = abeja.vuelo || abeja.ajuste;
        return volando ? 0.45 + 0.55 * Math.abs(Math.sin(ahora / 26)) : 0.7 + 0.3 * Math.abs(Math.sin(ahora / 70));
      }

      // ---- Salida ----

      function pintarSalida(ahora) {
        const k = (ahora - salida.inicio) / SALIDA_MS;
        if (k >= 1) {
          salida = null;
          rastro = [];
          return;
        }
        const alfa = 1 - k;
        const antes = salida.antes;
        if (antes.modo === 'senalar' || antes.modo === 'marcar') {
          for (const o of antes.objetivos) {
            dibujarMarco(o.rect, alfa, -3 * G.suave(k), antes.modo === 'senalar');
            if (antes.modo === 'marcar' && o.etiqueta) {
              ctx.save();
              ctx.globalAlpha = alfa;
              dibujarEtiqueta(o.rect, o.etiqueta);
              ctx.restore();
            }
          }
        }
        if (salida.desde) {
          const s = G.salidaAbejita(salida.desde, salida.origen, k);
          salida.ultimo = s.p;
          rastro.push({ p: s.p, t: ahora });
          ctx.save();
          ctx.globalAlpha = s.alfa;
          dibujarRastro(ahora);
          dibujarAbeja(s.p, 0.45 + 0.55 * Math.abs(Math.sin(ahora / 26)));
          ctx.restore();
        }
        programar(true);
      }

      // ---- Cuadro ----

      function pintar(ahora) {
        cuadro = 0;
        limpiar();
        if (salida) {
          pintarSalida(ahora);
          return;
        }
        const d = dibujo;
        if (!d || d.modo === 'vacio') return;
        const quieto = sinMovimiento();
        let rapido = false;
        let sigue = false;

        if (d.modo === 'senalar') {
          const k = quieto ? 1 : limitar((ahora - anilloDesde) / ANILLO_MS);
          for (const o of d.objetivos) {
            if (ahora < anilloDesde && !quieto) continue;
            if (!quieto && k >= 1) dibujarLatido(o.rect, ahora);
            dibujarMarco(o.rect, k, 6 * (1 - G.suave(k)), true);
          }
          if (!quieto) {
            sigue = true;
            if (ahora < anilloDesde || k < 1) rapido = true;
          }
        } else if (d.modo === 'marcar') {
          const k = quieto ? 1 : limitar((ahora - marcaDesde) / MARCA_MS);
          for (const o of d.objetivos) {
            dibujarMarco(o.rect, k, 4 * (1 - G.suave(k)), false);
            if (o.etiqueta) dibujarEtiqueta(o.rect, o.etiqueta);
          }
          if (k < 1) rapido = sigue = true;
        } else if (d.modo === 'lectura' && abeja && !quieto) {
          dibujarPulso(abeja.destino, ahora);
          sigue = true;
        }

        if (abeja) {
          if (moverAbeja(ahora, quieto, d.modo === 'lectura')) rapido = true;
          if (!quieto && dibujarRastro(ahora)) rapido = true;
          if (!quieto && dibujarDestello(ahora)) rapido = true;
          dibujarAbeja(abeja.pos, aleteo(ahora, quieto));
          if (!quieto) sigue = true;
        }

        if (sigue) programar(rapido);
      }

      // ---- Dibujos que llegan ----

      function destinoDe(d) {
        if (d.modo === 'senalar') {
          const i = G.masCercano(d.origen, d.objetivos);
          return i < 0 ? null : G.posAbejita(d.objetivos[i].rect, d.origen, monitor());
        }
        if (d.modo === 'lectura') return G.acotar(d.origen, monitor(), 30);
        return null;
      }

      function volar(desde, hasta, ahora) {
        rastro = [];
        destello = { p: desde, inicio: ahora };
        abeja = { pos: desde, destino: hasta, vuelo: null, ajuste: null, llegada: ahora };
        if (Math.hypot(hasta[0] - desde[0], hasta[1] - desde[1]) < 4) return 0;
        const dur = G.duracionVuelo(desde, hasta);
        abeja.vuelo = { p0: desde, c: G.controlCurva(desde, hasta, monitor(), MARGEN_CURVA), p1: hasta, inicio: ahora, dur };
        return dur;
      }

      function recibir(d, nueva) {
        const ahora = performance.now();
        const quieto = sinMovimiento();
        const antes = dibujo;
        // Otro aviso de "vacío" mientras sale: que termine la salida.
        if (salida && d.modo === 'vacio') {
          dibujo = d;
          return;
        }
        // Si llega un dibujo mientras el anterior se iba, la abejita despega desde donde quedó.
        const desdeSalida = salida && (salida.ultimo || salida.desde);
        salida = null;
        dibujo = d;
        parar();
        borrarTodo();
        if (nueva) marcaDesde = ahora;

        if (d.modo === 'vacio' && antes && antes.modo !== 'vacio' && !quieto) {
          // Se limpió el dibujo: sale animado en vez de desaparecer de golpe.
          salida = { inicio: ahora, antes, desde: abeja ? abeja.pos : null, origen: antes.origen, ultimo: null };
          abeja = null;
          destello = null;
          rastro = rastro.slice(-6);
          programar(true);
          return;
        }

        const destino = destinoDe(d);

        if (!destino) {
          // Sin objetivo a la vista: la abejita se queda donde estaba solo si sigue señalando.
          if (d.modo !== 'senalar') {
            abeja = null;
            rastro = [];
            destello = null;
          }
        } else if (quieto) {
          abeja = { pos: destino, destino, vuelo: null, ajuste: null, llegada: ahora };
          rastro = [];
          destello = null;
          anilloDesde = ahora - ANILLO_MS;
        } else if (abeja && !nueva && antes && antes.modo === d.modo) {
          // Mismo turno: el objetivo se movió. Se reacomoda sin volver a despegar.
          if (Math.hypot(destino[0] - abeja.destino[0], destino[1] - abeja.destino[1]) > 0.5) {
            if (abeja.vuelo) {
              abeja.vuelo.p1 = destino;
              abeja.vuelo.c = G.controlCurva(abeja.vuelo.p0, destino, monitor(), MARGEN_CURVA);
            } else {
              abeja.ajuste = { desde: abeja.pos, hasta: destino, inicio: ahora };
              abeja.llegada = ahora + AJUSTE_MS;
            }
            abeja.destino = destino;
          }
        } else {
          // Turno nuevo: despega desde donde está la abejita, o desde el origen si no estaba.
          const dur = volar(abeja ? abeja.pos : desdeSalida || d.origen, destino, ahora);
          anilloDesde = ahora + dur * 0.55;
        }
        programar(true);
      }

      async function actualizar() {
        let e;
        try {
          e = await invoke('nudo_pagina_estado');
        } catch (_) {
          return;
        }
        const d = e.dibujo || { modo: 'vacio', origen: [0, 0], objetivos: [], generacion: generacion };
        if (d.generacion < generacion) return;
        const nueva = !dibujo || d.generacion !== generacion;
        generacion = d.generacion;
        recibir(d, nueva);
      }

      listen('nudo-dibujo', actualizar);

      window.addEventListener('resize', () => {
        ajustar();
        if (dibujo) recibir(dibujo, false);
      });

      ajustar();
      actualizar();
    </script>
  </body>
</html>
